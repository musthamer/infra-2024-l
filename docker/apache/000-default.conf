<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/project_2024

    <Directory /var/www/html/project_2024>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/project_2024/ /usr/lib/cgi-bin/project_2024/

    <Directory /usr/lib/cgi-bin/project_2024>
        AllowOverride None
        Options +ExecCGI
        AddHandler cgi-script .sh
        Require all granted
    </Directory>

    DirectoryIndex index.html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>