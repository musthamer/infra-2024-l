services:
  db:
    image: mariadb:11.4
    container_name: infra-2024-l-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: infra-2024-l_db
      MARIADB_USER: infra-2024-l
      MARIADB_PASSWORD: aqsfm6hUFhvub99ORFrG
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/initdata.sql:/docker-entrypoint-initdb.d/01-initdata.sql:ro

  workuser:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: infra-2024-l-workuser
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: infra-2024-l
      DB_PASS: aqsfm6hUFhvub99ORFrG
      DB_NAME: infra-2024-l_db
      EMAIL_QUEUE_HOST: 0.0.0.0
      EMAIL_QUEUE_PORT: 4000
    command: ["bash", "-lc", "chmod +x /opt/project/scripts/*.sh /opt/project/cgi/*.sh; /opt/project/scripts/workuser_container_entrypoint.sh"]
    volumes:
      - ./scripts:/opt/project/scripts:ro
      - ./cgi:/opt/project/cgi:ro
      - ./runtime:/opt/project/runtime
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "bash", "/opt/project/scripts/workuser_health.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: infra-2024-l-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      workuser:
        condition: service_started
    environment:
      DB_HOST: db
      DB_USER: infra-2024-l
      DB_PASS: aqsfm6hUFhvub99ORFrG
      DB_NAME: infra-2024-l_db
      APP_COOKIE_PATH: /
      SESSION_TTL_SECONDS: 28800
      EMAIL_QUEUE_HOST: workuser
      EMAIL_QUEUE_PORT: 4000
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html/project_2024:ro
      - ./cgi:/usr/lib/cgi-bin/project_2024:ro

volumes:
  mariadb_data: