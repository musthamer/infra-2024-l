<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesterprojekt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="accordion">
        <div class="group" id="login">
            <h3>Login</h3>
            <div class="content">
                <form id="loginForm">
                    <label for="email">E-Mail:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="password">Passwort:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit">Anmelden</button>
                </form>
            </div>
        </div>
        <div class="group" id="map">
            <h3>Karte</h3>
            <div id="mapContent" class="content">
                <!-- Leaflet map goes here -->
            </div>
        </div>
        <div class="group" id="ships">
            <h3>Schiffe</h3>
            <div id="shipsContent" class="content">
                <!-- Ships table goes here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
